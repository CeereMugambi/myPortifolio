<section class="hero">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <div class="card glass">
    <span class="badge">✦ Welcome to my world</span>

    <h1>
      Hi, I'm <span class="name">Ceere</span>
    </h1>

    <p class="role"><span #typed></span></p>

    <p class="bio">
      I build elegant, fast and thoughtful web experiences, with a soft spot
      for clean code, beautiful interfaces and AI-powered workflows.
    </p>

    <div class="actions">
      <a class="btn primary" routerLink="/projects">View my work</a>
      <a class="btn ghost" routerLink="/contact">Let's talk</a>
    </div>

    <div class="stats">
      @for (s of stats; track s.label) {
        <div class="stat glass">
          <strong>{{ s.value }}</strong>
          <span>{{ s.label }}</span>
        </div>
      }
    </div>
  </div>
</section>
